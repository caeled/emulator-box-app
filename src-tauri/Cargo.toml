[package]
name = "emulator-box"
version = "1.0.0"
description = "The Emulator Box desktop shell"
authors = ["Steven Powell"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
